/* Layout: one patient walks a line of twelve stops; each stop deals a deck of the guideline changes that apply there. A searchable list reaches any card. */
:root{
  color-scheme: light;
  --bg:#EAF0ED; --card:#FFFFFF; --ink:#0F1F1A; --ink2:#44544E; --ink3:#56665F; --soft:#F1F4F2; --line:#DCE3DF;
  --me:#FF5A1F;
  --deep:#0F4136; --tint:#CDEBDB;
  --on-ink:#FFFFFF; --on-ink2:rgba(255,255,255,.86);
  --node:#7C8B85; --dash:#9AA7A2; --ring:#FFFFFF; --glow:rgba(255,90,31,.5);
  --sheen:rgba(255,255,255,.72); --dimc:#0F1F1A;
  --kc-bg:#FFFFFF; --kc-fg:#8F2D08; --ku-bg:rgba(255,255,255,.72);
  --pend-bd:rgba(15,31,26,.45); --pend-bg:rgba(255,255,255,.35);
  --kc-soft:#FFE2D2; --kc-soft-fg:#0F1F1A;
  --scrim:rgba(15,31,26,.34);
  --sh-btn:0 1px 1px rgba(15,31,26,.06),0 8px 18px -12px rgba(15,31,26,.45);
  --sh-nb:0 1px 1px rgba(15,31,26,.06),0 10px 20px -12px rgba(15,31,26,.4);
  --sh-face:0 1px 1px rgba(15,31,26,.05),0 26px 50px -24px rgba(15,31,26,.34),inset 0 0 0 1px rgba(15,31,26,.05);
  --sh-detail:0 1px 1px rgba(15,31,26,.05),0 26px 50px -26px rgba(15,31,26,.3),inset 0 0 0 1px rgba(15,31,26,.05);
  --sh-sheet:0 -12px 40px rgba(15,31,26,.2);
  --sh-list:0 30px 80px -20px rgba(15,31,26,.45);
  --grain-amb:.06; --grain-card:.07; --amb-o:1;
  --display:'Bricolage', 'Instrument Sans', system-ui, sans-serif;
  --ui:'Instrument Sans', system-ui, -apple-system, sans-serif;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
html.wait .app{opacity:0}
button{font-family:inherit}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.al{position:absolute;inset:-25%;opacity:0;transition:opacity .9s ease;will-change:transform,opacity;
  background:radial-gradient(38% 34% at 24% 20%, var(--a1) 0%, transparent 72%), radial-gradient(40% 36% at 80% 84%, var(--a2) 0%, transparent 72%);
  animation:drift 26s ease-in-out infinite alternate}
.al.on{opacity:var(--amb-o)}
.amb::after{content:'';position:absolute;inset:0;background-image:var(--noise);background-size:160px 160px;opacity:var(--grain-amb)}
@keyframes drift{from{transform:translate3d(-4%,-3%,0) rotate(0deg)}to{transform:translate3d(4%,3%,0) rotate(7deg)}}

.s-pre{--deep:#0F4136;--tint:#CDEBDB}
.s-air{--deep:#123A63;--tint:#D3E4F7}
.s-lin{--deep:#0A4A4D;--tint:#C9E9E6}
.s-the{--deep:#3A2B6E;--tint:#E0D8F6}
.s-rsk{--deep:#6B2A12;--tint:#F9D9C9}
.s-bld{--deep:#74141F;--tint:#F6D2D6}
.s-spc{--deep:#4A3A1A;--tint:#EFE3CF}
.s-obs{--deep:#6C1C3B;--tint:#F7D5E1}
.s-kid{--deep:#5A3A04;--tint:#F5E1B5}
.s-pain{--deep:#283275;--tint:#D9DDF8}
.s-aft{--deep:#26462A;--tint:#D8EACF}
.s-sys{--deep:#253B45;--tint:#DCE5E8}

  :root:not([data-mode]):not([data-theme="light"]) .s-pre{--deep:#BDEBD4;--tint:#163A2D}
  :root:not([data-mode]):not([data-theme="light"]) .s-air{--deep:#C9DEF7;--tint:#17304C}
  :root:not([data-mode]):not([data-theme="light"]) .s-lin{--deep:#BDE8E4;--tint:#123A3C}
  :root:not([data-mode]):not([data-theme="light"]) .s-the{--deep:#DDD3FA;--tint:#2A2451}
  :root:not([data-mode]):not([data-theme="light"]) .s-rsk{--deep:#FBD3BF;--tint:#45261B}
  :root:not([data-mode]):not([data-theme="light"]) .s-bld{--deep:#F8CDD3;--tint:#47212A}
  :root:not([data-mode]):not([data-theme="light"]) .s-spc{--deep:#F0DFC2;--tint:#3A3021}
  :root:not([data-mode]):not([data-theme="light"]) .s-obs{--deep:#F8CCDC;--tint:#46222F}
  :root:not([data-mode]):not([data-theme="light"]) .s-kid{--deep:#F6DDA6;--tint:#3E3116}
  :root:not([data-mode]):not([data-theme="light"]) .s-pain{--deep:#D3D8FA;--tint:#242B56}
  :root:not([data-mode]):not([data-theme="light"]) .s-aft{--deep:#CDE8C0;--tint:#1F3522}

}

.app{position:relative;z-index:1;box-sizing:border-box;height:100%;min-height:540px;display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;padding:14px 16px 12px;transition:opacity .3s}
.hd-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd .tag{margin:0;font-size:13.5px;font-weight:700;color:var(--ink2)}
.hd h1{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:31px;line-height:1.02;letter-spacing:-.03em}
.hd .sub{margin:6px 0 0;font-size:15px;line-height:1.4;color:var(--ink2)}
.find{all:unset;box-sizing:border-box;position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px 0 13px;border-radius:999px;cursor:pointer;
  background:var(--card);color:var(--ink);font-size:14.5px;font-weight:700;box-shadow:var(--sh-btn)}
.find:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.hd .tag{min-width:0}
.hd-btns{display:flex;align-items:center;gap:8px;flex:none}
.mode{all:unset;box-sizing:border-box;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--sh-btn)}
.mode:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mode:active{transform:scale(.94)}
@media (max-width:374px){ .tg1{display:none} .find{padding:0 13px 0 12px} }
.abt{all:unset;box-sizing:border-box;flex:none;width:40px;height:40px;border-radius:50%;display:none;place-items:center;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--sh-btn)}
.abt:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.abt:active{transform:scale(.94)}
/* just added: an orange dot on the search button, beside the card count and on the card's row in the list */
.fdot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--me);box-shadow:0 0 0 2.5px var(--bg)}
.jdot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--me);vertical-align:1px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}

/* the line */
.rail{margin:10px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent)}
.rail::-webkit-scrollbar{display:none}
.track{position:relative;display:flex;width:max-content;min-width:100%}
.stop{all:unset;box-sizing:border-box;cursor:pointer;flex:1 0 92px;width:92px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 4px 6px;text-align:center;border-radius:14px}
.stop:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.node{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2.5px var(--node);transition:background .35s, box-shadow .35s;flex:none}
.stop.done .node{background:var(--ink);box-shadow:none}
.stop.on .node{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink)}
.nm{font-size:13px;font-weight:400;line-height:1.2;color:var(--ink2);transition:color .3s}
.stop.done .nm{color:var(--ink)}
.stop.on .nm{color:var(--ink);font-weight:700}
.ct{display:none}
.line,.fill{position:absolute;border-radius:2px;pointer-events:none}
.line{background:repeating-linear-gradient(90deg,var(--dash) 0 5px,transparent 5px 10px);transform-origin:0 50%}
.fill{background:var(--ink);transform-origin:0 50%;transition:transform .8s cubic-bezier(.3,1.15,.45,1)}
.me{position:absolute;left:0;top:0;z-index:2;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--me);
  box-shadow:0 0 0 4px var(--ring),0 6px 16px var(--glow);transition:transform .8s cubic-bezier(.34,1.4,.5,1);pointer-events:none}
.me::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--me);animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(1.9);opacity:0}}

/* the deck */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;margin-top:10px}
.deck{position:relative;flex:1 1 auto;min-height:330px;max-height:620px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
.deck.grabbing{cursor:grabbing}
.card{position:absolute;left:0;right:0;top:0;bottom:30px;transform-origin:50% 100%;will-change:transform;visibility:hidden}
.card:focus-visible .face{outline:3px solid var(--ink);outline-offset:3px}
.face{position:absolute;inset:0;box-sizing:border-box;display:flex;flex-direction:column;border-radius:30px;overflow:hidden;background:var(--card);
  box-shadow:var(--sh-face)}
.face::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--dimc);opacity:var(--dim,0);pointer-events:none;will-change:opacity}
.panel{position:relative;isolation:isolate;flex:1 1 auto;display:flex;flex-direction:column;padding:18px 20px 20px;overflow:hidden;
  background:radial-gradient(90% 60% at 100% 0%, var(--sheen) 0%, transparent 100%), var(--tint)}
.panel::after{content:'';position:absolute;z-index:-1;inset:0;background-image:var(--noise);background-size:160px 160px;opacity:var(--grain-card)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;gap:6px;align-items:center;min-width:0}
.badge{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;line-height:1.05;white-space:nowrap}
.k-c{background:var(--kc-bg);color:var(--kc-fg)}
.k-n{background:var(--ink);color:var(--on-ink)}
.k-u{background:var(--ku-bg);color:var(--ink)}
.pend{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;line-height:1.05;white-space:nowrap;color:var(--ink);border:1.5px dashed var(--pend-bd);background:var(--pend-bg)}
.date{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ttl{flex:none;margin:14px 0 0;max-width:96%;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.14;letter-spacing:-.015em;color:var(--deep);text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.snug .ttl{font-size:19px}
.card.snug .line-t{font-size:16px}
.card.snug .unit{font-size:19px}
.panel > *,.body{opacity:var(--c,1)}
.card.compact .ttl{display:none}
.card.compact .old{margin-bottom:6px}
.card.compact .panel{padding-bottom:14px}
.card.tight .ol{display:none}
.card.tight .line-t{font-size:15.5px}
.card.tight .unit{font-size:18px;margin-top:4px}
.card.tight .panel{padding-top:14px}
.heroBox{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;padding-top:14px}
.old{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-bottom:12px}
.ol{font-size:13px;font-weight:700;color:var(--ink2);word-spacing:.12em}
.ov{position:relative;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.02em;color:var(--ink3);white-space:nowrap}
.strike{position:absolute;left:-3px;right:-3px;top:54%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--me);transform-origin:0 50%}
.body{flex:none;padding:14px 20px 14px}
.hero{font-family:var(--display);font-weight:700;font-size:92px;line-height:.9;letter-spacing:-.035em;color:var(--deep);text-wrap:balance;font-variant-numeric:tabular-nums}
.hero.nw{white-space:nowrap}
.num{display:inline-block;text-align:right}
.unit{margin-top:8px;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.12;color:var(--deep);letter-spacing:-.01em;text-wrap:balance}
.line-t{margin:0;font-size:17px;line-height:1.42;color:var(--ink2);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:var(--lc,3);-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink2);min-height:36px}
.foot .by{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr{display:flex;align-items:center;gap:10px;flex:none}
.acc{font-weight:700;color:var(--ink)}
.more{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}

.nav{flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px;margin-top:6px}
.nb{all:unset;box-sizing:border-box;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);cursor:pointer;
  box-shadow:var(--sh-nb);transition:transform .15s,opacity .2s}
.nb:active{transform:scale(.9)}
.nb:disabled{opacity:.35;cursor:default}
.nb:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pos{text-align:center;display:grid;gap:2px}
.pos b{font-size:15px;font-variant-numeric:tabular-nums}
.pos span{font-size:13.5px;color:var(--ink2)}
.pos span.fresh{color:var(--ink);font-weight:700}

/* detail, shared by the phone sheet and the wide-screen panel */
.d-st{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0;font-size:13.5px;font-weight:700;color:var(--deep)}
.d-st i{width:10px;height:10px;border-radius:50%;background:var(--me);flex:none}
.d-st .pend{font-size:12.5px;padding:4px 9px}
.d h2{margin:10px 0 6px;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.08;letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
.d-by{margin:0;font-size:15px;line-height:1.4;color:var(--ink2)}
.ba{margin-top:18px}
.bef,.aft{border-radius:18px;padding:14px 16px}
.bef{background:var(--soft);color:var(--ink2)}
.aft{background:var(--tint);color:var(--ink)}
.lbl2{display:block;margin-bottom:6px;font-size:13.5px;font-weight:700;color:var(--deep)}

.bef p,.aft p{margin:0;font-size:16.5px;line-height:1.5}
.join{height:30px;display:grid;place-items:center;color:var(--me)}
.first{margin:10px 2px 0;font-size:14.5px;line-height:1.45;color:var(--ink2)}
.also{margin-top:16px;padding:0 2px}
.also .lbl2{color:var(--ink)}
.also ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.also li{position:relative;padding-left:18px;font-size:15.5px;line-height:1.45;color:var(--ink)}
.also li::before{content:'';position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--deep);opacity:.55}
.note{margin:14px 2px 0;font-size:14px;line-height:1.45;color:var(--ink2);font-style:italic}
.read{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:16px 18px;border-radius:18px;background:var(--ink);color:var(--on-ink);text-decoration:none;font-weight:700;font-size:16px}
.read small{font-weight:400;font-size:14px;color:var(--on-ink2);white-space:nowrap}
.read span{white-space:nowrap}
.read svg{vertical-align:-2px;margin-left:6px}
.read:focus-visible{outline:3px solid var(--me);outline-offset:3px}
.links{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.links a{display:block;padding:9px 4px;font-size:15px;font-weight:700;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.links a svg{vertical-align:-1px;margin-left:6px}
.rel{margin-top:16px}
.rl{all:unset;box-sizing:border-box;display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--soft);cursor:pointer}
.rl b{display:block;font-size:14.5px;line-height:1.3;color:var(--ink)}
.rl span{display:block;margin-top:2px;font-size:13px;color:var(--ink2)}
.rl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cite{margin:12px 2px 0;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.share{margin-top:14px}
.cp{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:46px;padding:10px 16px;border-radius:14px;background:var(--soft);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.cp:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cp:active{transform:scale(.98)}
.cpf{all:unset;box-sizing:border-box;display:block;width:100%;margin-top:8px;padding:11px 12px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;color:var(--ink);-webkit-user-select:text;user-select:text}
.cpf:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.cpm{margin:7px 2px 0;font-size:13.5px;color:var(--ink2)}

.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(42px + env(safe-area-inset-top, 0px));z-index:21;box-sizing:border-box;margin:0 auto;max-width:560px;background:var(--card);
  border-radius:28px 28px 0 0;overflow:auto;padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh-sheet)}
.scrim[hidden],.sheet[hidden],.list[hidden]{display:none}
.x{all:unset;position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink);cursor:pointer}
.x:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sheet .d{padding-right:44px}
.sheet .d .ba,.sheet .d .read,.sheet .d .also,.sheet .d .links,.sheet .d .share{margin-right:-44px}
.detail{display:none}

/* the searchable list */
.list{position:fixed;inset:0;z-index:31;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg)}
.list-hd{position:relative;flex:none;padding:16px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.list-hd h2{margin:4px 56px 12px 2px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.list-hd .x{top:12px;right:12px;background:var(--card)}
.list-hd h2:focus{outline:none}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.search input{all:unset;flex:1;min-width:0;font-size:16.5px;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.found{margin:10px 2px 0;font-size:13.5px;color:var(--ink2)}
.list-bd{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grp h3{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:9px;margin:0;padding:14px 2px 8px;background:var(--bg);font-size:14px;font-weight:700;color:var(--ink)}
.grp h3 i{width:12px;height:12px;border-radius:4px;background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--deep)}
.grp h3 span{font-weight:400;color:var(--ink2)}
.li{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:12px 14px;margin:0 0 6px;border-radius:14px;background:var(--card);cursor:pointer}
.li:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.li b{font-size:15.5px;line-height:1.3;color:var(--ink)}
.li span{grid-column:1;font-size:13.5px;color:var(--ink2);line-height:1.35}
.li em{grid-column:2;grid-row:1 / span 2;font-style:normal;font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap}
.li em.k-c{background:var(--kc-soft);color:var(--kc-soft-fg)}
.li em.k-u{background:var(--soft);color:var(--ink)}
.li em.p{background:transparent;border:1.5px dashed var(--pend-bd);color:var(--ink)}
.none{margin:30px 4px;font-size:15.5px;color:var(--ink2)}
.li[hidden],.grp[hidden],.none[hidden],.ab-row[hidden]{display:none}
.jgrp h3 i{width:10px;height:10px;border-radius:50%;background:var(--me);box-shadow:none}
.ab-row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 12px;padding:12px 14px;margin:10px 0 2px;border-radius:14px;cursor:pointer;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.ab-row svg{grid-row:1 / span 2}
.ab-row b{font-size:15.5px;line-height:1.3}
.ab-row span{grid-column:2;font-size:13.5px;line-height:1.35;color:var(--ink2)}
.ab-row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ab-ft{display:none}
.ab-back{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:16px;background:var(--ink);color:var(--on-ink);font-size:16px;font-weight:700;cursor:pointer}
.ab-back:focus-visible{outline:3px solid var(--me);outline-offset:3px}
.ab-back:active{transform:scale(.98)}
.ab-l{all:unset;cursor:pointer;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ab-l:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
/* the about page */
.ab{max-width:620px;margin:0 auto;padding:10px 0 8px}
.ab h3{margin:26px 2px 8px;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.ab p{margin:0 2px 10px;font-size:16px;line-height:1.55;color:var(--ink2);text-wrap:pretty}
.ab p.lead{font-size:17px;color:var(--ink)}
.ab p b{color:var(--ink)}
.ab a.out{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ab a.out svg{vertical-align:-1px;margin-left:4px}
.ab a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.lgd{margin:0;padding:2px 14px;border-radius:16px;background:var(--card)}
.lgd div{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.lgd div:last-child{border-bottom:0}
.lgd dt{flex:0 0 136px;margin:0}
.lgd dd{flex:1 1 220px;margin:0;font-size:15px;line-height:1.45;color:var(--ink2)}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap;line-height:1.05}
.chip.k-c{background:var(--kc-soft);color:var(--kc-soft-fg)}
.chip.k-u{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.chip.p{padding:3.5px 8px;border:1.5px dashed var(--pend-bd);color:var(--ink)}
.chip.j{padding-left:0;padding-right:0;color:var(--ink)}
.apps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.apps a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 12px;padding:12px 14px;border-radius:14px;background:var(--card);text-decoration:none}
.apps b{font-size:15.5px;line-height:1.3;color:var(--ink)}
.apps span{grid-column:1;font-size:14px;line-height:1.4;color:var(--ink2)}
.apps svg{grid-column:2;grid-row:1 / span 2;color:var(--ink2)}
.credit{margin:22px 2px 0;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--ink2)}
.credit b{color:var(--ink)}

@media (max-width:759px){
  .list-hd{padding-top:calc(16px + env(safe-area-inset-top, 0px))}
  .list-hd .x{top:calc(12px + env(safe-area-inset-top, 0px))}
  .ab-ft{display:block;flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));background:var(--bg);border-top:1px solid var(--line)}
  .about .list-bd{padding-bottom:16px}
}
@media (max-width:759px) and (max-height:760px){
  .hd .sub,.hd h1{display:none}
  .app{padding-top:10px}
  .stop{padding-top:14px}
  .rail{margin-top:4px}
  .stage{margin-top:4px}
  .card{bottom:24px}
  .nav{margin-top:2px}
}
@media (min-width:760px){
  .app{max-width:1120px;height:auto;min-height:100%;padding:24px 28px;display:grid;align-content:center;column-gap:28px;position:relative;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"hd hd" "rail rail" "stage detail"}
  .hd{grid-area:hd}.rail{grid-area:rail}.stage{grid-area:stage}.detail{grid-area:detail}
  .hd h1{font-size:40px}
  .rail{margin:14px -28px 6px;padding:0 28px}
  .stage{margin-top:14px}
  .deck{flex:none;height:clamp(520px, calc(var(--vh, 900px) - 560px), 640px);max-height:none}
  .more{display:none}
  .abt{display:grid}
  .detail{display:flex;flex-direction:column;position:absolute;top:0;left:0;right:0;margin-top:14px;max-height:var(--dmax, 614px);box-sizing:border-box;background:var(--card);border-radius:30px;overflow:hidden;
    box-shadow:var(--sh-detail)}
  .detail h2{font-size:32px}
  .dsc{flex:0 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:28px 28px 24px;outline:none}
  .dsc.below{-webkit-mask-image:linear-gradient(#000 calc(100% - 72px), transparent);mask-image:linear-gradient(#000 calc(100% - 72px), transparent)}
  .list{inset:5% 0 auto;margin:0 auto;width:min(680px, calc(100% - 48px));height:90%;border-radius:28px;overflow:hidden;box-shadow:var(--sh-list)}
  .list-hd{padding:20px 22px 14px}
  .list-bd{padding:4px 22px 24px}
}
@media (min-width:1100px), (min-width:1000px) and (min-aspect-ratio:5/4){
  .app{height:100%;min-height:520px;padding:26px 36px;column-gap:40px;align-content:stretch;
    max-width:1320px;grid-template-columns:260px minmax(360px,420px) minmax(400px,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hd stage detail" "rail stage detail"}
  .hd{display:flex;flex-direction:column;align-items:flex-start}
  .hd-row{display:contents}
  .hd .tag{order:0}
  .hd h1{order:1;font-size:38px}
  .hd .sub{order:2}
  .hd-btns{order:3;margin-top:16px}
  .rail{margin:18px 0 0;padding:0;overflow:visible;-webkit-mask-image:none;mask-image:none;align-self:start}
  .track{flex-direction:column;width:auto;min-width:0}
  .stop{flex:none;width:auto;flex-direction:row;align-items:center;text-align:left;gap:14px;padding:8px 8px}
  .nm{font-size:15px;flex:1}
  .ct{display:block;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .line{background:repeating-linear-gradient(180deg,var(--dash) 0 5px,transparent 5px 10px);transform-origin:50% 0}
  .fill{transform-origin:50% 0}
  .stage{margin:0;justify-content:center}
  .deck{height:min(600px, calc(100% - 70px))}
  .detail{position:static;margin:0;align-self:center;max-height:100%}
}
@media (min-width:1100px) and (max-width:1239px), (min-width:1000px) and (max-width:1239px) and (min-aspect-ratio:5/4){
  .app{padding:24px 26px;column-gap:28px;grid-template-columns:220px minmax(320px,400px) minmax(340px,1fr)}
  .hd h1{font-size:31px}
}
@media (min-width:1100px) and (max-height:760px), (min-width:1000px) and (min-aspect-ratio:5/4) and (max-height:760px){
  .hd .sub{display:none}
  .stop{padding:6px 8px}
}
/* a narrow detail panel (smaller iPads) sets its words a little tighter so more fits without scrolling */
.detail{container-type:inline-size}
@container (max-width:430px){
  .dsc{padding:22px 22px 20px}
  .detail h2{font-size:27px}
  .detail .d-by{font-size:14.5px}
  .detail .ba{margin-top:14px}
  .detail .bef p,.detail .aft p{font-size:15.5px;line-height:1.45}
  .detail .also li{font-size:15px}
  .detail .join{height:24px}
}
@media (prefers-reduced-motion:reduce){
  .al,.me::after{animation:none}
  .al{transition:none}
  .me,.fill,.node,.nm{transition:none}
}

sured blood glucose", "l": "CGM can add trend monitoring around surgery; insulin and other key decisions rest on a checked glucose (1B).", "a": "An important adjunct to standard monitoring for trends, rapid swings and early warning of hypoglycaemia or severe hyperglycaemia. Allow for sensor lag and interference from bypass, deep hypothermia, unstable haemodynamics, electromagnetic fields and drugs; confirm with capillary or blood glucose before key decisions (1B).", "ay": "2026", "x": ["Avoid glucose of 10 mmol/L or more and hypoglycaemia, above all under 3 mmol/L (1B); aim for a coefficient of variation of 36% or less (2B).", "If CGM nears 3.9 mmol/L or falls quickly during surgery, recheck promptly and act on the result (1B).", "Cardiothoracic and major vascular surgery: manage on standard glucose monitoring in theatre, with CGM as a trend adjunct (1B)."], "t": "Continuous glucose monitoring around surgery, China", "by": "Chinese Society of Anesthesiology, with the National Alliance of Geriatric Anesthesia", "sb": "Chinese Society of Anesthesiology", "d": "Sep 2026", "acc": "Free in Chinese", "url": "https://rs.yiigle.com/cmaid/1698141", "c": "Zhonghua Yi Xue Za Zhi 2026; 106(36): 3846–65", "note": "GRADE: 1 strong, 2 weak; evidence A to D.", "links": [["PubMed record", "https://pubmed.ncbi.nlm.nih.gov/42778315/"]], "see": ["peri-operative-management-of-diabetes", "diabetes-care-in-hospital-standards-of-care-2026", "perioperative-hyperglycaemia-brazil"]}, {"id": "unanticipated-difficult-intubation-in-adults", "bl": "Before · 2015", "rep": "2015", "s": "air", "k": "U", "h": "First pass", "n": 1, "u": "success and continuous oxygen come first", "l": "Plans A to D stay; continuous oxygen delivery and first-attempt success come first. 65 recommendations.", "b": "The recommendations were founded on published evidence and, where it was lacking, member feedback and expert opinion.", "a": "65 recommendations from a systematic review of 1241 papers and a three-round Delphi t low doses for the shortest time, and regional anaesthesia.", "ay": "2026", "x": ["Enhanced monitoring may include processed EEG, NIRS and blood lactate, though there are no data yet on lactate’s usefulness.", "Mitochondrial DNA sequencing can identify the MT-ND4 m.11232T>C variant; some laboratories may have classed it as benign.", "Routine population-wide genetic screening cannot be universally recommended."], "t": "Venezuelan maternal ancestry, European statement", "by": "ESAIC, ESPA, ERN EURO-NMD Mitochondrial Working Group and the European Mitochondrial (E-MIT) Society", "sb": "ESAIC, ESPA and partners", "d": "Mar 2026", "dd": "26 March 2026, page updated 11 June 2026", "acc": "Free", "url": "https://esaic.org/joint-statement-on-anaesthesia-related-mitochondrial-pharmacogenetic-risk-in-individuals-with-venezuelan-maternal-ancestry/", "c": "ESAIC joint statement, 26 March 2026", "note": "Expert position statement; it says it is not a formal clinical guideline.", "see": ["maternal-venezuelan-ancestry-and-general", "halogenated-agents-and-venezuelan-ancestry", "venezuelan-ancestry-asa-and-spa-update"]}, {"id": "venezuelan-ancestry-asa-and-spa-update", "s": "rsk", "k": "U", "h": "Volatiles", "u": "consider avoiding all in at-risk patients", "l": "Consider avoiding all volatile anaesthetics in patients with direct maternal Venezuelan lineage.", "os": "Updates the July 2025 statement", "bl": "Before · July 2025", "b": "Aware of severe neurological damage in five previously healthy Venezuelan children, four of whom died; insufficient data to make any specific recommendations.", "a": "Consider asking about potential maternal Venezuelan heritage; any patient with direct maternal Venezuelan lineage should be considered at risk. Consider avoiding all volatile anaesthetics until more information is available; regional anaesthesia should be considered where appropriate.", "ay": "2026", "x": ["Processed EEG to avoid burst suppression may be advisable; monitor for return to 11885198/", "c": "Anaesthesia 2025; 80: 425–47", "see": ["liver-resection", "tranexamic-acid-during-surgery", "factor-concentrates-for-perioperative-bleeding", "perioperative-bleeding-and-coagulation-china"]}, {"id": "intravenous-iron-and-adverse-events", "s": "bld", "k": "N", "h": "Not needed", "u": "routine 30-minute wait after IV iron", "l": "Suggests routine prolonged observation after IV iron, such as a mandatory 30 minutes, is not required.", "a": "Routine prolonged observation after the infusion (for example a mandatory 30-minute period) is not required (suggestion). Monitor closely during the infusion, especially at the start.", "ay": "2026", "x": ["Keep test doses and premedication for patients with substantial risk factors.", "Hypophosphataemia risk depends on the formulation, cumulative dose and frequency."], "t": "Intravenous iron and adverse events", "by": "Network for the Advancement of Patient Blood Management, Haemostasis and Thrombosis (NATA)", "sb": "NATA", "d": "Jul 2026", "acc": "Free", "url": "https://www.sciencedirect.com/science/article/pii/S0007091226003983", "c": "Br J Anaesth 2026; 137: 708–20"}, {"id": "heparin-induced-thrombocytopenia-and-cardiac", "s": "bld", "k": "N", "h": "Heparin", "u": "re-exposure low risk if assays are negative", "l": "Negative assays: evidence suggests brief heparin in surgery has a low HIT recurrence risk, with monitoring after.", "a": "For patients with negative functional assays, evidence suggests that limited intraoperative unfractionated heparin re-exposure carries a low risk of HIT recurrence, provided postoperative monitoring is performed.", "ay": "2026", "x": ["Bivalirudin has the strongest data, but bleeding and no reversal agent limit its use.", "Plasma exchange, with or without IVIG, lowers antibody titres and allows heparin during surgery."], "src": "abstract", "t": "Heparin-induced thrombocytopenia and cardiac surgery", "by": "International Society on Thrombosis and Haemostasis (ISTH)", "sb": "ISTH", pecialty by specialty.", "a": "Tiers now rest on the procedure itself (tissue injury, control of bleeding, consequences), in 11 specialty tables; the old percentages remain as anchors. Any procedure under spinal or epidural anaesthesia counts as high risk, as do deep or non-compressible plexus and peripheral nerve blocks.", "ay": "2026", "t": "Bleeding risk on anticoagulants before planned surgery", "by": "ISTH Scientific and Standardization Committee, Subcommittee on Perioperative and Critical Care Thrombosis and Haemostasis", "sb": "ISTH", "d": "Feb 2026", "acc": "Subscription", "url": "https://doi.org/10.1016/j.jtha.2025.12.031", "c": "Shaw JR, et al. J Thromb Haemost 2026; 24: 2640–55", "see": ["doacs-and-adult-cardiac-surgery", "regional-anaesthesia-and-antithrombotic-drugs", "regional-anaesthesia-on-antithrombotic-drugs"]}, {"id": "doacs-and-adult-cardiac-surgery", "note": "Each statement is rated high, moderate or low strength; the stopping times are moderate. The paper does not say whether days count from the last dose; ISTH counts 2 full days as a last dose 60–72 h before.", "x": ["Longer stops may be considered with weight under 60 kg, age over 75, female sex, Child-Pugh B or C, or amiodarone or verapamil.", "Routine heparin bridging should not be performed, as it adds bleeding risk (low strength).", "Andexanet is not recommended when heparin will be needed for bypass, because of heparin resistance (high strength).", "Idarucizumab 5 g (dabigatran) or 4F-PCC 25–50 IU/kg (bleeding after bypass) may be considered first line (moderate strength)."], "n": 1, "s": "bld", "k": "N", "h": "2 days", "u": "off DOACs may suffice, if no risk factors", "l": "If no risk factors for high DOAC levels, at least 2 days off before elective cardiac surgery may suffice.", "a": "Without risk factors for high drug levels, stopping at least 2 days before may be sufficient. If CrCl is under 50 ml/min, it is reasonable to hold rivaroxaban or apixaban at least 3 days and dabigatran at least 5; under 30 ml/min, Xa inhibitors at least 4 days.", "ay": "2026", "t": "DOACs and adult cardiac surgery", "by": "Society of Cardiovascular Anesthesiologists and Society of Thoracic Surgeons", "sb": "SCA, STS", "d": "Jan 2026", "acc": "Subscription", "url": "https://doi.org/10.1213/ANE.0000000000007868", "c": "Budd AN, et al. Anesth Analg 2026; 142: 668–81", "see": ["bleeding-risk-on-anticoagulants-before-planned", "regional-anaesthesia-and-antithrombotic-drugs", "regional-anaesthesia-on-antithrombotic-drugs"]}, {"id": "venous-thromboembolism-after-day-surgery", "note": "Position statement: its advice is not graded, and the task force calls it unvalidated. Its flow chart applies the low-risk checks first, so it does not say what to do for a short procedure in a patient with previous VTE.", "x": ["Also high risk: pelvic or cancer surgery (not skin), abdominoplasty, TIA, stroke, MI, heart failure, thrombophilia, pregnancy.", "No drug, dose or duration is set: SAMBA suggests agreeing it with the surgeon, noting risk lasts up to 12 weeks.", "Patients with bleeding risk, such as coagulopathy or severe kidney disease, should get baseline and mechanical measures only."], "n": 1, "s": "bld", "k": "N", "h": "<60 min", "u": "procedures need no VTE prophylaxis", "l": "Recommends no VTE prophylaxis for under-18s, procedures under 60 min, or local anaesthesia or sedation.", "a": "No prophylaxis for under-18s, procedures under 60 min, or local anaesthesia or sedation. Everyone else gets hydration, early mobilisation, education and mechanical prophylaxis; high-risk cases, such as joint replacement or prior DVT or PE, should also get a drug if not contraindicated.", "ay": "2026", "t": "Venous thromboembolism after day surgery", "by": "Society for Ambulatory Anesthesia (SAMBA)", "sb": "SAMBA", "d": "Apr 2026", "acc": "Subscription", "url": "https://doi.org/10.1213/ANE.0000000000008044", "c": "Rajan N, et al. Anesth Analg 2026; 143: 750–7"}, {"id": "perioperative-antithromboti ations differ from the previous ones in that a TAP block is now recommended, and gabapentinoids are no longer advised.", "ay": "2025", "x": ["Bilateral TAP blocks and port-site infiltration, with paracetamol and an NSAID or COX-2 inhibitor.", "IV dexamethasone during surgery; opioids for rescue only."], "src": "abstract", "t": "Analgesia after laparoscopic sleeve gastrectomy (PROSPECT)", "by": "PROSPECT Working Group, European Society of Regional Anaesthesia", "sb": "PROSPECT", "d": "Oct 2025", "dd": "Online Oct 2025, 2026 issue", "acc": "Subscription", "url": "https://doi.org/10.1097/EJA.0000000000002296", "c": "Eur J Anaesthesiol 2026; 43: 19–33"}, {"id": "analgesia-after-hallux-valgus-repair-prospect", "s": "pain", "k": "C", "h": "Surgical", "w": 1, "u": "the one change: minimally invasive osteotomy", "l": "The one change is surgical: minimally invasive or percutaneous osteotomy is recommended over open.", "o": "Percutaneous not advised", "ol": "2020", "b": "Percutaneous chevron osteotomy was not recommended because of conflicting evidence.", "a": "Minimally invasive surgery or percutaneous osteotomy is recommended over open osteotomy.", "ay": "2025", "x": ["Popliteal sciatic block is not recommended: patients cannot walk without crutches.", "IV dexamethasone 0.1–0.2 mg/kg during surgery is suggested."], "t": "Analgesia after hallux valgus repair (PROSPECT)", "by": "PROSPECT Working Group, European Society of Regional Anaesthesia", "sb": "PROSPECT", "d": "Oct 2025", "dd": "Online Oct 2025, 2026 issue", "acc": "Free", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12700695/", "c": "Eur J Anaesthesiol 2026; 43: 11–18"}, {"id": "local-and-regional-analgesia-for-chest-breast", "s": "pain", "k": "N", "h": "Fascial plane", "w": 1, "u": "blocks, strongly recommended", "l": "For open cardiothoracic, abdominal, retroperitoneal and pelvic surgery, and mastectomy, in adults.", "a": "Fascial plane blocks are strongly recommended to reduce pain or opioid use in the first 24   const a = el.querySelector('.face').getBoundingClientRect(), b = sheet.getBoundingClientRect();
  return `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`;
}
function openDetail(){
  touched = true; setPs();
  if (mqWide.matches){ if (!reduce) detail.animate([{transform:'scale(1)'},{transform:'scale(1.015)'},{transform:'scale(1)'}], {duration:360, easing:'ease-out'}); return; }
  const c = CARDS[cur];
  sheetBody.className = `d s-${c.s}`; sheetBody.innerHTML = detailHTML(c, 'sh-t');
  scrim.hidden = false; sheet.hidden = false; sheetOpen = true; sheet.scrollTop = 0;
  if (!reduce){
    sheet.animate([{transformOrigin:'0 0', transform:flipFrom(els[cur]), borderRadius:'30px'},{transformOrigin:'0 0', transform:'none', borderRadius:'28px 28px 0 0'}], {duration:480, easing:'cubic-bezier(.2,.85,.25,1)'});
    [...sheetBody.children].forEach((ch,k)=>ch.animate([{opacity:0, transform:'translateY(14px)'},{opacity:1, transform:'none'}], {duration:340, delay:190 + k*45, easing:'ease-out', fill:'backwards'}));
    scrim.animate([{opacity:0},{opacity:1}], {duration:320});
  }
  $('x').focus({preventScroll:true});
}
function closeSheet(){
  if (!sheetOpen) return; sheetOpen = false;
  const done = ()=>{ sheet.hidden = true; scrim.hidden = true; sheet.getAnimations().forEach(a=>a.cancel()); scrim.getAnimations().forEach(a=>a.cancel());
    sheetBody.getAnimations({subtree:true}).forEach(a=>a.cancel()); els[cur].focus({preventScroll:true}); };
  if (reduce) return done();
  sheetBody.animate([{opacity:1},{opacity:0}], {duration:140, fill:'forwards'});
  scrim.animate([{opacity:1},{opacity:0}], {duration:320, fill:'forwards'});
  const an = sheet.animate([{transformOrigin:'0 0', transform:'none', borderRadius:'28px 28px 0 0'},{transformOrigin:'0 0', transform:flipFrom(els[cur]), borderRadius:'30px'}], {duration:380, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
  an.onfinish = done;
}
$('x').addEventListener('click', closeSheet);
scrim.addEventListener('click', ()=>{ if (sheetOpen) closeSheet(); else closePane(); });

// ---- the searchable list of every guideline
const list = $('list'), lb = $('lb'), q = $('q'), found = $('found');
const rowHTML = (c, i, stop) => `<button class="li" type="button" data-i="${i}"><b>${FRESH.has(c.id) ? '<i class="jdot" role="img" aria-label="Just added"></i>' : ''}${esc(c.t)}</b><span>${stop ? esc(STOPS[SI[c.s]].name) + ' · ' : ''}${esc(c.sb)} · ${c.d.replace(' ', '\u00a0')}</span><em class="${c.p ? 'p' : 'k-' + c.k.toLowerCase()}">${c.p ? PEND[c.p] : KIND[c.k]}</em></button>`;
const freshRows = CARDS.map((c,i)=>[c,i]).filter(([c])=>FRESH.has(c.id));
lb.innerHTML = `<button class="ab-row" id="abRow" type="button" data-about>${INFO}<b>About this tracker</b><span>What the labels mean, tips, and more teaching tools</span></button>`
  + (freshRows.length ? `<section class="grp jgrp"><h3><i></i>Just added <span>${freshRows.length}</span></h3>${freshRows.map(([c,i])=>rowHTML(c, i, true)).join('')}</section>` : '')
  + STOPS.map(s=>{
  const rows = CARDS.map((c,i)=>[c,i]).filter(([c])=>c.s===s.k).map(([c,i])=>rowHTML(c, i, false)).join('');
  return `<section class="grp s-${s.k}" data-s="${s.k}"><h3><i></i>${s.name} <span>${s.n}</span></h3>${rows}</section>`;
}).join('') + `<p class="none" id="none" hidden>Nothing matches. Try a drug, a society or a year.</p>
  <p class="credit"><b>${CREDIT}</b><br>Checked ${CHECKED}. <button class="ab-l" type="button" data-about>About this tracker</button></p>`;
const fold = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u2010-\u2015]/g, '-').replace(/([a-z])[-\s]+(\d)/g, '$1$2');
const US = [['anesth','anaesth'],['pediatr','paediatr'],['hemorr','haemorr'],['hematol','haematol'],['hemodyn','haemodyn'],['hemost','haemost'],['hemoglob','haemoglob'],['cesarean','caesarean'],['esophag','oesophag'],['anemi','anaemi'],['edema','oedema'],['orthoped','orthopaed'],['ischemi','ischaemi'],['labor','labour'],['tumor','tumour'],['glycemi','glycaemi']];
const SYN = {succinylcholine:'suxamethonium', scoline:'suxamethonium', sux:'suxamethonium', txa:'tranexamic', kids:'child', kid:'child', peds:'paediatric', paeds:'paediatric', semaglutide:'glp1', ozempic:'glp1', wegovy:'glp1', tirzepatide:'glp1', mounjaro:'glp1', zepbound:'glp1', liraglutide:'glp1', dulaglutide:'glp1', exenatide:'glp1', dapagliflozin:'sglt2', empagliflozin:'sglt2', canagliflozin:'sglt2', ertugliflozin:'sglt2', sotagliflozin:'sglt2', apixaban:'doac', rivaroxaban:'doac', edoxaban:'doac', dabigatran:'doac', noac:'doac', csection:'caesarean', nausea:'ponv', vomiting:'ponv', ponv:'nausea', hyperthermia:'mh', mh:'hyperthermia', tiva:'intravenous', rsi:'rapid sequence', dvt:'thromboembolism', vte:'thromboembolism', ecmo:'extracorporeal', nmb:'neuromuscular', tof:'train-of-four'};
const alts = t => { const a = new Set([t]); US.forEach(([us, uk])=>{ if (t.includes(us)) a.add(t.replace(us, uk)); }); if (SYN[t]) a.add(fold(SYN[t])); return [...a]; };
const hit = (h, t) => (t.length <= 3 && /^[a-z0-9]/.test(t)) ? new RegExp('(^|[^a-z0-9])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(h) : h.includes(t);
const hay = CARDS.map(c=>fold([c.t, c.by, c.sb, c.h, c.u, c.l, c.a, (c.x||[]).join(' '), STOPS[SI[c.s]].name, c.acc, KIND[c.k], c.d, c.c, c.p ? (c.p === 2 ? 'scope only paywalled' : 'summary to come pending') : ''].join(' ')));
const rowsEl = [...lb.querySelectorAll('.li')];
function filterList(){
  const terms = fold(q.value).split(/\s+/).filter(Boolean).map(alts), got = new Set();
  rowsEl.forEach(r=>{ const h = hay[+r.dataset.i]; const ok = terms.every(ts=>ts.some(t=>hit(h, t))); r.hidden = !ok; if (ok) got.add(r.dataset.i); });
  // while searching, each match shows once, under its stop
  lb.querySelectorAll('.grp').forEach(g=>{ g.hidden = !g.querySelector('.li:not([hidden])') || (terms.length > 0 && g.classList.contains('jgrp')); });
  $('abRow').hidden = terms.length > 0;
  const n = got.size;
  $('none').hidden = n > 0;
  found.textContent = terms.length ? `${n} of ${N} guidelines` : `${N} guidelines in ${STOPS.length} stops. Pick one to jump to its card.`;
}
q.addEventListener('input', filterList);
rowsEl.forEach(r=>r.addEventListener('click', ()=>{ const i = +r.dataset.i; closePane(true, list); goTo(i); }));
const about = $('about'), panes = [];
function openPane(el, focusEl, from){
  if (panes.some(p=>p.el === el)) return;
  panes.push({el, from: from || document.activeElement});
  el.hidden = false; el.style.zIndex = 30 + panes.length;
  const wide = mqWide.matches;
  if (wide && scrim.hidden){ scrim.hidden = false; if (!reduce) scrim.animate([{opacity:0},{opacity:1}], {duration:260}); }
  if (!reduce) el.animate(wide ? [{opacity:0, transform:'translateY(16px) scale(.98)'},{opacity:1, transform:'none'}] : [{transform:'translateY(100%)'},{transform:'none'}],
    {duration: wide ? 280 : 420, easing:'cubic-bezier(.2,.85,.25,1)'});
  focusEl.focus({preventScroll:true});
}
function closePane(picked, which){
  const k = which ? panes.findIndex(p=>p.el === which) : panes.length - 1; if (k < 0) return;
  const [top] = panes.splice(k, 1), el = top.el, wide = mqWide.matches;
  const done = ()=>{ el.hidden = true; el.getAnimations().forEach(a=>a.cancel()); if (!panes.length && !sheetOpen) scrim.hidden = true;
    if (!picked && top.from && top.from.isConnected) top.from.focus({preventScroll:true}); };
  if (reduce) return done();
  const a = el.animate(wide ? [{opacity:1},{opacity:0, transform:'translateY(10px) scale(.98)'}] : [{transform:'none'},{transform:'translateY(100%)'}],
    {duration: wide ? 180 : 300, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
  a.onfinish = done;
}
function openList(focusSearch){ filterList(); openPane(list, (focusSearch || mqWide.matches) ? q : $('list-t')); }
$('find').addEventListener('click', ()=>openList(false));
$('lx').addEventListener('click', ()=>closePane(false, list));

// ---- the about page
const LEGEND = [
  ['<span class="chip k-c">Changed</span>', 'A recommendation changed. The card shows the old value struck through.'],
  ['<span class="chip k-u">Updated</span>', 'A new edition replaces an earlier one.'],
  ['<span class="chip k-n">New</span>', 'A first edition, with no earlier guidance from that body to compare.'],
  ['<span class="chip p">Summary to come</span>', 'The full text has not been read yet, so the card gives the scope. The key changes will follow.'],
  ['<span class="chip p">Scope only</span>', 'The full text is behind a paywall, so the card gives the scope only.'],
  ['<span class="chip j"><i class="jdot"></i>Just added</span>', 'Added since you last looked, on this device.']];
$('abBody').innerHTML = `<div class="ab">
  <p class="lead">What changed in anaesthesia guidelines since October 2024: ${N} guidelines, one card each, along the patient’s path from before surgery to afterwards, with safety and systems at the end.</p>
  <p>Each card shows the change at a glance. Tap or click it for the detail: before and after, the other key points, related cards and a link to the full guideline. On a larger screen the detail is beside the card.</p>
  <h3>Sources and grades</h3>
  <p>Cards drawn from an abstract say so. Grades and strengths of recommendation are the guideline’s own.</p>
  <h3>What the labels mean</h3>
  <dl class="lgd">${LEGEND.map(([k, t])=>`<div><dt>${k}</dt><dd>${t}</dd></div>`).join('')}</dl>
  <h3>Kept up to date</h3>
  <p>Checked ${CHECKED}. New guidelines are looked for every month, and each new card is checked before it is added.</p>
  <h3>Tips</h3>
  <p>Search finds drugs by brand or generic name, societies and years. On a keyboard, press / to search and use the arrow keys to move between cards.</p>
  <p>To send a colleague one card, open its detail and use the link button at the end. The link opens straight on that card.</p>
  <h3>Please note</h3>
  <p>A summary to help you find your way, not a substitute for the guideline. Read the full text before changing practice, and follow local policy where it differs.</p>
  <h3>Your privacy</h3>
  <p>The tracker has no sign-in and sends nothing about you. It remembers only your light or dark choice and which cards you have seen, and only on this device.</p>
  <h3>Made by</h3>
  <p><b>${CREDIT}</b></p>
  <p>Spotted an error or a missing guideline? <a class="out" href="https://www.linkedin.com/in/ganeshsivasankara" target="_blank" rel="noopener">Message me on LinkedIn${ARROW}</a></p>
  <h3>Licence</h3>
  <p>© 2026 Ganesh Sivasankara. Shared under <a class="out" style="white-space:nowrap" href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="noopener">CC BY-NC-ND 4.0${ARROW}</a>: you may share it unchanged, with credit, but not for commercial use. The guidelines belong to their publishers.</p>
  <h3>More teaching tools</h3>
  <ul class="apps">${APPS.map(([t, u, d])=>`<li><a href="${u}" target="_blank" rel="noopener"><b>${t}</b><span>${d}</span>${ARROW}</a></li>`).join('')}</ul>
</div>`;
$('abx').innerHTML = XX;
const openAbout = ()=>{
  about.querySelector('.list-bd').scrollTop = 0;
  const li = panes.findIndex(p=>p.el === list), from = li >= 0 ? panes[li].from : document.activeElement;
  openPane(about, $('ab-t'), from);
  if (li < 0) return;
  // the list closes once About has slid over it
  const drop = ()=>{ const k = panes.findIndex(p=>p.el === list); if (k >= 0){ panes.splice(k, 1); list.hidden = true; } };
  const an = about.getAnimations()[0]; if (an) an.finished.then(drop, drop); else drop();
};
$('abBack').innerHTML = `${CHEV(0)}<span>Back to the guidelines</span>`;
$('abx').addEventListener('click', ()=>closePane(false, about));
$('abBack').addEventListener('click', ()=>closePane(false, about));
addEventListener('click', e=>{ if (e.target.closest && e.target.closest('[data-about]')) openAbout(); });

// ---- first run: the line draws, the patient drops on, the deck is dealt
const cardFromLink = ()=>{ let h = ''; try{ h = decodeURIComponent(location.hash.slice(1)).toLowerCase(); }catch(e){} return IDX[h]; };
const start = cardFromLink() ?? 0;
addEventListener('hashchange', ()=>{ const j = cardFromLink(); if (j === undefined || j === cur) return;
  if (sheetOpen) closeSheet(); while (panes.length) closePane(true); goTo(j); });
function intro(){
  document.documentElement.classList.remove('wait');
  if (reduce){ countUp(els[start]); return; }
  const hd = document.querySelector('.hd');
  [...hd.children].forEach((ch,k)=>ch.animate([{opacity:0, transform:'translateY(10px)'},{opacity:1, transform:'none'}], {duration:500, delay:k*70, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards'}));
  line.animate([{transform: railV ? 'scaleY(0)' : 'scaleX(0)'},{transform: railV ? 'scaleY(1)' : 'scaleX(1)'}], {duration:900, delay:120, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards'});
  stopBtns.forEach((b,j)=>{
    b.querySelector('.node').animate([{transform:'scale(0)'},{transform:'scale(1)'}], {duration:460, delay:160 + j*55, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'backwards'});
    b.querySelector('.nm').animate([{opacity:0, transform:'translateY(6px)'},{opacity:1, transform:'none'}], {duration:420, delay:220 + j*55, easing:'ease-out', fill:'backwards'});
  });
  me.animate([{translate:'0 -48px', scale:'.3', opacity:0},{translate:'0 0', scale:'1', opacity:1}], {duration:720, delay:700, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'backwards'});
  const vis = els.slice(start, start + 4);
  vis.forEach((el,j)=>el.querySelector('.face').animate([{transform:'translateY(140px) rotate(-5deg)', opacity:0},{opacity:1, offset:.22},{transform:'none', opacity:1}], {duration:760, delay:320 + (vis.length-1-j)*110, easing:'cubic-bezier(.2,.9,.25,1.08)', fill:'backwards'}));
  document.querySelector('.nav').animate([{opacity:0},{opacity:1}], {duration:500, delay:900, fill:'backwards'});
  setTimeout(()=>countUp(els[start]), 320 + (vis.length-1)*110 + 420);
  setTimeout(()=>{ if (touched || cur !== start || sheetOpen || panes.length) return;
    els[start].querySelector('.face').animate([{transform:'none'},{transform:'translateX(-40px) rotate(-2.5deg)', offset:.42},{transform:'none'}], {duration:1100, easing:'cubic-bezier(.45,0,.2,1)'}); }, 3000);
}

history.scrollRestoration = 'manual';
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ measure(); showDetail(false); prefit(); }, 100); });
mqWide.addEventListener && mqWide.addEventListener('change', ()=>{ if (sheetOpen && mqWide.matches){ sheetOpen = false; sheet.hidden = true; } scrim.hidden = !(sheetOpen || (panes.length && mqWide.matches)); });
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{
  scrollTo(0,0);
  pos = aim = start;
  measure(); showDetail(false);
  requestAnimationFrame(intro);
  setTimeout(prefit, 1600);
});
</script>
